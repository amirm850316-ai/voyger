<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VOYAGER | خدمات تبلیغاتی و رسانه‌ای</title>

<!--
=====================================================================
  راهنمای ویرایش سریع  (EDIT GUIDE)
  همه‌ی متن‌ها و شماره‌تلفن‌ها داخل آبجکت CONFIG در تگ <script> پایین صفحه
  قرار دارند. کافیه همون‌جا مقادیر رو عوض کنی، نیازی به تغییر جای دیگه نیست.
=====================================================================
-->

<style>
  :root{
    --obsidian:#0a0a0a;
    --obsidian-2:#141210;
    --obsidian-3:#1c1916;
    --gold-deep:#8a6a1f;
    --gold-mid:#d4af37;
    --gold-bright:#f4d06f;
    --ivory:#ece4d3;
    --ivory-dim:#a89c86;
    --hairline:rgba(212,175,55,.18);
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    background:var(--obsidian);
    color:var(--ivory);
    font-family:'Vazirmatn',sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
  }

  body{
    min-height:100vh;
  }

  ::selection{background:var(--gold-mid);color:#0a0a0a;}

  .eng{font-family:'Oswald',sans-serif;letter-spacing:.14em;}

  /* ================= SPLASH ================= */
  #splash{
    position:fixed;inset:0;
    background:
      radial-gradient(circle at 50% 40%, #171410 0%, #0a0a0a 70%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:999;
    transition:opacity .9s ease, visibility .9s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;pointer-events:none;}

  .splash-logo-wrap{
    width:38vw;max-width:210px;min-width:120px;
    opacity:0;
    transform:scale(.82);
    animation:logoIn 1.1s cubic-bezier(.16,.84,.44,1) forwards;
    position:relative;
  }
  .splash-logo-wrap img{
    width:100%;display:block;
    filter:drop-shadow(0 0 26px rgba(212,175,55,.35));
  }
  .splash-shine{
    position:absolute;inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.55) 48%, transparent 62%);
    background-size:250% 250%;
    background-position:150% 0;
    mix-blend-mode:overlay;
    animation:shine 1.6s ease-out .55s forwards;
  }
  @keyframes logoIn{
    0%{opacity:0;transform:scale(.82) translateY(6px);}
    100%{opacity:1;transform:scale(1) translateY(0);}
  }
  @keyframes shine{
    0%{background-position:150% 0;}
    100%{background-position:-50% 0;}
  }
  .splash-tag{
    margin-top:22px;
    font-size:11.5px;
    letter-spacing:.4em;
    color:var(--gold-mid);
    opacity:0;
    animation:fadeUp .8s ease forwards .5s;
  }
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(10px);}
    to{opacity:1;transform:translateY(0);}
  }

  /* ================= HEADER ================= */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 18px;
  }
  header img{height:30px;width:auto;filter:drop-shadow(0 0 8px rgba(212,175,55,.25));}
  header .word{font-size:15px;color:var(--gold-mid);font-weight:600;}

  /* ================= LAYOUT ================= */
  main{
    max-width:640px;
    margin:0 auto;
    padding:0 22px 70px;
  }

  .blade{
    width:64px;height:3px;
    margin:0 auto;
    background:linear-gradient(90deg, transparent, var(--gold-mid), transparent);
    clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
  }

  section{
    padding:46px 0;
    border-bottom:1px solid var(--hairline);
    opacity:0;
    transform:translateY(18px);
    transition:opacity .7s ease, transform .7s ease;
  }
  section.in{opacity:1;transform:translateY(0);}
  section:last-of-type{border-bottom:none;}

  .eyebrow{
    text-align:center;
    font-size:12px;
    color:var(--gold-mid);
    letter-spacing:.25em;
    margin-bottom:14px;
  }

  h1.hero-title{
    text-align:center;
    font-size:26px;
    font-weight:800;
    line-height:1.5;
    color:var(--ivory);
    margin-bottom:18px;
  }
  h1.hero-title b{color:var(--gold-bright);font-weight:800;}

  .quote{
    text-align:center;
    font-size:15.5px;
    line-height:2.1;
    color:var(--ivory-dim);
    position:relative;
    padding:0 8px;
  }
  .quote::before,.quote::after{
    content:"";
    display:block;
    width:26px;height:1px;
    background:var(--gold-deep);
    margin:18px auto;
  }

  .services-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:8px;
  }
  .service-card{
    background:var(--obsidian-2);
    border:1px solid var(--hairline);
    border-radius:4px;
    padding:20px 14px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .service-card::before{
    content:"";
    position:absolute;top:0;right:0;
    width:0;height:0;
    border-style:solid;
    border-width:0 22px 22px 0;
    border-color:transparent var(--gold-deep) transparent transparent;
    opacity:.55;
  }
  .service-card .num{
    font-family:'Oswald',sans-serif;
    font-size:11px;
    color:var(--gold-mid);
    letter-spacing:.15em;
    display:block;
    margin-bottom:10px;
  }
  .service-card .label{
    font-size:14.5px;
    font-weight:600;
    color:var(--ivory);
    line-height:1.7;
  }

  .about-text{
    font-size:15px;
    line-height:2.15;
    color:var(--ivory-dim);
    text-align:justify;
  }
  .about-text b{color:var(--gold-bright);}

  .closing{
    text-align:center;
    font-size:18px;
    font-weight:700;
    line-height:1.9;
    color:var(--gold-bright);
  }
  .closing .eng{
    display:block;
    font-size:12px;
    color:var(--ivory-dim);
    margin-top:10px;
    font-weight:400;
  }

  /* ================= CONTACT ================= */
  .contact-title{
    text-align:center;
    font-size:20px;
    font-weight:800;
    margin-bottom:8px;
    color:var(--ivory);
  }
  .contact-sub{
    text-align:center;
    font-size:13px;
    color:var(--ivory-dim);
    margin-bottom:28px;
  }

  .contact-list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .contact-btn{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    background:linear-gradient(180deg, var(--obsidian-3), var(--obsidian-2));
    border:1px solid var(--hairline);
    border-radius:6px;
    padding:18px 20px;
    text-decoration:none;
    color:var(--ivory);
    position:relative;
    transition:transform .25s ease, border-color .25s ease, background .25s ease;
  }
  .contact-btn:active{transform:scale(.98);}
  .contact-btn:hover{border-color:var(--gold-mid);}

  .contact-btn .txt{
    display:flex;flex-direction:column;gap:4px;
  }
  .contact-btn .txt .title{
    font-size:15px;font-weight:700;color:var(--ivory);
  }
  .contact-btn .txt .hint{
    font-size:11.5px;color:var(--ivory-dim);
  }

  .contact-btn .icon{
    width:38px;height:38px;
    min-width:38px;
    border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 14px rgba(212,175,55,.35);
  }
  .contact-btn .icon svg{width:17px;height:17px;fill:#0a0a0a;}

  footer{
    text-align:center;
    padding:30px 0 10px;
    font-size:11px;
    color:var(--ivory-dim);
    letter-spacing:.15em;
  }

  @media(max-width:380px){
    h1.hero-title{font-size:22px;}
    .services-grid{grid-template-columns:1fr;}
  }
</style>
</head>

<main>

  <!-- بخش معرفی -->
  <section id="sec-intro">
    <div class="eyebrow">معرفی اصلی ویجر</div>
    <h1 class="hero-title" id="cfg-intro-title"></h1>
    <p class="quote" id="cfg-intro-quote"></p>
  </section>

  <!-- بخش خدمات -->
  <section id="sec-services">
    <div class="eyebrow">خدمات ما</div>
    <div class="services-grid" id="cfg-services"></div>
  </section>

  <!-- بخش درباره ما -->
  <section id="sec-about">
    <div class="eyebrow">درباره ویجر</div>
    <p class="about-text" id="cfg-about"></p>
  </section>

  <!-- جمله پایانی -->
  <section id="sec-closing">
    <div class="blade" style="margin-bottom:22px;"></div>
    <p class="closing" id="cfg-closing"></p>
  </section>

  <!-- بخش تماس -->
  <section id="sec-contact">
    <div class="contact-title" id="cfg-contact-title"></div>
    <div class="contact-sub" id="cfg-contact-sub"></div>
    <div class="contact-list" id="cfg-contact-list"></div>
  </section>

  <footer class="eng" id="cfg-footer"></footer>

</main>

<script>
/* =====================================================================
   CONFIG — همه‌چیز از همینجا قابل ویرایشه
   فقط مقادیر داخل کوتیشن (" ") رو تغییر بده، به ساختار کد کاری نداشته باش
===================================================================== */
const CONFIG = {

  introTitle: "خدمات تبلیغاتی و رسانه‌ای",

  introQuote: "«ما در ویجر باور داریم هر ایده‌ای، وقتی درست طراحی و اجرا شود، می‌تواند دیده شود، ماندگار بماند و به نتیجه برسد.»",

  services: [
    "طراحی گرافیک و هویت بصری",
    "طراحی و راه‌اندازی سایت",
    "تدوین و تولید محتوای ویدیویی",
    "خدمات رسانه‌ای و ادمینی"
  ],

  about: "ویجر یک مجموعه خدمات تبلیغاتی و رسانه‌ای است که با هدف کمک به کسب‌وکارها، برندها و مجموعه‌های مختلف برای حضور حرفه‌ای‌تر در فضای دیجیتال و تبلیغات فعالیت می‌کند. از طراحی یک پوستر و محتوای شبکه‌های اجتماعی تا طراحی سایت، تدوین و اجرای پروژه‌های تبلیغاتی؛ تلاش ما این است که مسیر ایده تا اجرا را برای شما ساده‌تر، حرفه‌ای‌تر و خلاقانه‌تر کنیم.",

  closingMain: "جایی برای تبدیل ایده به تصویر، محتوا و نتیجه",
  closingEng: "IDEA . VISUAL . CONTENT . RESULT",

  contactTitle: "ارتباط با ویجر",
  contactSub: "روی هرکدام بزنید تا مستقیم وارد صفحه‌ی تماس تلفن شوید",

  // ⚠️ شماره‌ها رو اینجا ویرایش کن (فقط بین کوتیشن‌ها)
  contacts: [
    {
      title: "ارتباط با مدیریت",
      hint: "هماهنگی و امور کلی مجموعه",
      phone: "09104017402"
    },
    {
      title: "ارتباط با واحد فروش",
      hint: "قیمت‌گذاری، سفارش و خرید خدمات",
      phone: "09000000000"   // <-- شماره واحد فروش رو اینجا جایگزین کن
    },
    {
      title: "مشاوره و توضیحات بیشتر",
      hint: "راهنمایی قبل از شروع همکاری",
      phone: "09000000000"   // <-- شماره مشاوره رو اینجا جایگزین کن
    }
  ],

  footer: "VOYAGER · ADVERTISING & MEDIA AGENCY"
};

/* =====================================================================
   RENDER — این بخش رو تغییر نده مگر بخوای ساختار صفحه عوض بشه
===================================================================== */
document.getElementById('cfg-intro-title').innerHTML = CONFIG.introTitle;
document.getElementById('cfg-intro-quote').textContent = CONFIG.introQuote;
document.getElementById('cfg-about').innerHTML = CONFIG.about.replace('ویجر','<b>ویجر</b>');
document.getElementById('cfg-closing').innerHTML = CONFIG.closingMain + '<span class="eng">'+CONFIG.closingEng+'</span>';
document.getElementById('cfg-contact-title').textContent = CONFIG.contactTitle;
document.getElementById('cfg-contact-sub').textContent = CONFIG.contactSub;
document.getElementById('cfg-footer').textContent = CONFIG.footer;

const servicesWrap = document.getElementById('cfg-services');
CONFIG.services.forEach((s,i)=>{
  const card = document.createElement('div');
  card.className = 'service-card';
  card.innerHTML = `<span class="num eng">0${i+1}</span><div class="label">${s}</div>`;
  servicesWrap.appendChild(card);
});

const contactWrap = document.getElementById('cfg-contact-list');
const phoneIcon = `<svg viewBox="0 0 24 24"><path d="M6.6 10.8c1.4 2.8 3.8 5.1 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.4 0 .8-.2 1L6.6 10.8z"/></svg>`;

CONFIG.contacts.forEach(c=>{
  const a = document.createElement('a');
  a.href = 'tel:' + c.phone;
  a.className = 'contact-btn';
  a.innerHTML = `
    <div class="txt">
      <span class="title">${c.title}</span>
      <span class="hint">${c.hint}</span>
    </div>
    <div class="icon">${phoneIcon}</div>
  `;
  contactWrap.appendChild(a);
});

/* ================= SPLASH TIMER ================= */
window.addEventListener('load', ()=>{
  setTimeout(()=>{
    document.getElementById('splash').classList.add('hide');
  }, 2600); // مدت نمایش لوگو (میلی‌ثانیه) — 2600 = 2.6 ثانیه
});

/* ================= SCROLL REVEAL ================= */
const sections = document.querySelectorAll('section');
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting) e.target.classList.add('in');
  });
},{threshold:.15});
sections.forEach(s=>io.observe(s));
</script>

</body>
