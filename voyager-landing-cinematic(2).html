<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>VOYAGER | خدمات تبلیغاتی و رسانه‌ای</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Oswald:wght@400;500;600&display=swap" rel="stylesheet">

<!--
=====================================================================
  راهنمای ویرایش سریع  (EDIT GUIDE)
  ۱) همه‌ی متن‌ها و شماره‌تلفن‌ها داخل آبجکت CONFIG در تگ <script> پایین صفحه است.
  ۲) لوگو به‌صورت base64 داخل همین فایل جاسازی شده (دو جا: اسپلش و هدر) —
     برای عوض کردنش دنبال رشته‌ی data:image/jpeg;base64,... بگرد و جایگزین کن.
  ۳) مدت‌زمان و شدت موشن سینمایی داخل بخش SPLASH TIMING در جاوااسکریپت
     و متغیرهای CSS بالای فایل قابل تنظیمه.
=====================================================================
-->

<style>
  :root{
    --obsidian:#0a0a0a;
    --obsidian-2:#141210;
    --obsidian-3:#1c1916;
    --gold-deep:#8a6a1f;
    --gold-mid:#d4af37;
    --gold-bright:#f4d06f;
    --ivory:#ece4d3;
    --ivory-dim:#a89c86;
    --hairline:rgba(212,175,55,.18);

    /* --- تنظیمات موشن سینمایی --- */
    --letterbox-size:11vh;      /* ضخامت اولیه‌ی نوار سیاه بالا/پایین (حس سینمایی) */
    --logo-reveal-duration:2.1s;
    --curtain-duration:1.1s;
  }

  *{margin:0;padding:0;box-sizing:border-box;}

  html,body{
    background:var(--obsidian);
    color:var(--ivory);
    font-family:'Vazirmatn',sans-serif;
    overflow-x:hidden;
    scroll-behavior:smooth;
  }

  body{min-height:100vh;}
  ::selection{background:var(--gold-mid);color:#0a0a0a;}
  .eng{font-family:'Oswald',sans-serif;letter-spacing:.14em;}

  /* ========================================================
     SPLASH — سکانس سینمایی ابتدایی
  ======================================================== */
  #splash{
    position:fixed;inset:0;
    background:#000;
    display:flex;align-items:center;justify-content:center;
    z-index:999;
    overflow:hidden;
    transition:opacity .8s ease;
  }
  #splash.fade-out{opacity:0;pointer-events:none;}

  /* نور محیطی پشت لوگو، به‌آرامی نفس می‌کشد */
  .ambient-glow{
    position:absolute;
    width:120vw;height:120vw;
    max-width:900px;max-height:900px;
    background:radial-gradient(circle, rgba(212,175,55,.22) 0%, rgba(212,175,55,0) 62%);
    opacity:0;
    animation:glowIn 1.8s ease-out .25s forwards, breathe 3.5s ease-in-out 2s infinite;
  }
  @keyframes glowIn{ to{opacity:1;} }
  @keyframes breathe{
    0%,100%{transform:scale(1);opacity:1;}
    50%{transform:scale(1.08);opacity:.75;}
  }

  /* نویز فیلم / گرین سینمایی */
  .grain{
    position:absolute;inset:-20%;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.35'/></svg>");
    opacity:.05;
    mix-blend-mode:overlay;
    pointer-events:none;
    animation:grainShift 1.2s steps(4) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0);}
    25%{transform:translate(-2%,1%);}
    50%{transform:translate(1%,-2%);}
    75%{transform:translate(-1%,-1%);}
    100%{transform:translate(0,0);}
  }

  /* ویگنت گوشه‌های تیره برای عمق سینمایی */
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%);
    pointer-events:none;
  }

  /* نوارهای سینمااسکوپ بالا و پایین */
  .letterbox{
    position:absolute;left:0;right:0;
    background:#000;
    z-index:5;
    height:var(--letterbox-size);
    transition:height 1.3s cubic-bezier(.65,0,.35,1);
  }
  .letterbox.top{top:0;}
  .letterbox.bottom{bottom:0;}
  #splash.narrow .letterbox{height:3.2vh;}
  #splash.close .letterbox{height:52vh;transition:height var(--curtain-duration) cubic-bezier(.7,0,.3,1);}

  .splash-stage{
    position:relative;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    z-index:3;
  }

  .splash-logo-wrap{
    width:34vw;max-width:190px;min-width:110px;
    opacity:0;
    filter:blur(14px);
    transform:scale(1.22);
    position:relative;
    animation:cinematicReveal var(--logo-reveal-duration) cubic-bezier(.16,.85,.32,1) forwards;
  }
  .splash-logo-wrap img{
    width:100%;display:block;
    filter:drop-shadow(0 0 30px rgba(212,175,55,.4));
  }
  @keyframes cinematicReveal{
    0%{opacity:0;filter:blur(14px);transform:scale(1.22);}
    55%{opacity:1;filter:blur(0px);transform:scale(1);}
    100%{opacity:1;filter:blur(0px);transform:scale(1);}
  }

  .splash-shine{
    position:absolute;inset:0;
    background:linear-gradient(115deg, transparent 30%, rgba(255,255,255,.6) 48%, transparent 62%);
    background-size:250% 250%;
    background-position:150% 0;
    mix-blend-mode:overlay;
    opacity:0;
    animation:shine 1.4s ease-out 1.15s forwards;
  }
  @keyframes shine{
    0%{background-position:150% 0;opacity:1;}
    100%{background-position:-50% 0;opacity:1;}
  }

  .splash-tag{
    margin-top:26px;
    font-size:11px;
    letter-spacing:.05em;
    color:var(--gold-mid);
    opacity:0;
    animation:trackIn 1.1s ease-out 1.5s forwards;
  }
  @keyframes trackIn{
    from{opacity:0;letter-spacing:.6em;transform:translateY(6px);}
    to{opacity:1;letter-spacing:.4em;transform:translateY(0);}
  }

  .splash-line{
    width:0;height:1px;
    background:linear-gradient(90deg, transparent, var(--gold-mid), transparent);
    margin-top:16px;
    animation:lineGrow 1s ease-out 1.7s forwards;
  }
  @keyframes lineGrow{ to{width:120px;} }

  /* ========================================================
     HEADER
  ======================================================== */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(10,10,10,.82);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--hairline);
    display:flex;align-items:center;justify-content:center;gap:10px;
    padding:14px 18px;
  }
  header img{height:30px;width:auto;filter:drop-shadow(0 0 8px rgba(212,175,55,.25));}
  header .word{font-size:15px;color:var(--gold-mid);font-weight:600;}

  /* ========================================================
     LAYOUT
  ======================================================== */
  main{max-width:640px;margin:0 auto;padding:0 22px 70px;}

  .blade{
    width:64px;height:3px;margin:0 auto;
    background:linear-gradient(90deg, transparent, var(--gold-mid), transparent);
    clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
  }

  section{
    padding:46px 0;
    border-bottom:1px solid var(--hairline);
    opacity:0;
    transform:translateY(18px);
    transition:opacity .7s ease, transform .7s ease;
  }
  section.in{opacity:1;transform:translateY(0);}
  section:last-of-type{border-bottom:none;}

  .eyebrow{
    text-align:center;font-size:12px;color:var(--gold-mid);
    letter-spacing:.25em;margin-bottom:14px;
  }

  h1.hero-title{
    text-align:center;font-size:26px;font-weight:800;
    line-height:1.5;color:var(--ivory);margin-bottom:18px;
  }
  h1.hero-title b{color:var(--gold-bright);font-weight:800;}

  .quote{
    text-align:center;font-size:15.5px;line-height:2.1;
    color:var(--ivory-dim);position:relative;padding:0 8px;
  }
  .quote::before,.quote::after{
    content:"";display:block;width:26px;height:1px;
    background:var(--gold-deep);margin:18px auto;
  }

  .services-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px;
  }
  .service-card{
    background:var(--obsidian-2);
    border:1px solid var(--hairline);
    border-radius:4px;padding:20px 14px;text-align:center;
    position:relative;overflow:hidden;
  }
  .service-card::before{
    content:"";position:absolute;top:0;right:0;width:0;height:0;
    border-style:solid;border-width:0 22px 22px 0;
    border-color:transparent var(--gold-deep) transparent transparent;
    opacity:.55;
  }
  .service-card .num{
    font-family:'Oswald',sans-serif;font-size:11px;color:var(--gold-mid);
    letter-spacing:.15em;display:block;margin-bottom:10px;
  }
  .service-card .label{font-size:14.5px;font-weight:600;color:var(--ivory);line-height:1.7;}

  .about-text{font-size:15px;line-height:2.15;color:var(--ivory-dim);text-align:justify;}
  .about-text b{color:var(--gold-bright);}

  .closing{text-align:center;font-size:18px;font-weight:700;line-height:1.9;color:var(--gold-bright);}
  .closing .eng{display:block;font-size:12px;color:var(--ivory-dim);margin-top:10px;font-weight:400;}

  .contact-title{text-align:center;font-size:20px;font-weight:800;margin-bottom:8px;color:var(--ivory);}
  .contact-sub{text-align:center;font-size:13px;color:var(--ivory-dim);margin-bottom:28px;}
  .contact-list{display:flex;flex-direction:column;gap:14px;}

  .contact-btn{
    display:flex;align-items:center;justify-content:space-between;gap:14px;
    background:linear-gradient(180deg, var(--obsidian-3), var(--obsidian-2));
    border:1px solid var(--hairline);border-radius:6px;padding:18px 20px;
    text-decoration:none;color:var(--ivory);position:relative;
    transition:transform .25s ease, border-color .25s ease, background .25s ease;
  }
  .contact-btn:active{transform:scale(.98);}
  .contact-btn:hover{border-color:var(--gold-mid);}
  .contact-btn .txt{display:flex;flex-direction:column;gap:4px;}
  .contact-btn .txt .title{font-size:15px;font-weight:700;color:var(--ivory);}
  .contact-btn .txt .hint{font-size:11.5px;color:var(--ivory-dim);}
  .contact-btn .icon{
    width:38px;height:38px;min-width:38px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-bright), var(--gold-deep));
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 0 14px rgba(212,175,55,.35);
  }
  .contact-btn .icon svg{width:17px;height:17px;fill:#0a0a0a;}

  footer{text-align:center;padding:30px 0 10px;font-size:11px;color:var(--ivory-dim);letter-spacing:.15em;}

  @media(max-width:380px){
    h1.hero-title{font-size:22px;}
    .services-grid{grid-template-columns:1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    #splash, .letterbox, .splash-logo-wrap, .splash-shine, .splash-tag, .splash-line, .ambient-glow{
      animation:none !important;transition:none !important;
    }
    .splash-logo-wrap{opacity:1;filter:none;transform:none;}
  }
</style>
</head>

    <div class="txt">
      <span class="title">${c.title}</span>
      <span class="hint">${c.hint}</span>
    </div>
    <div class="icon">${phoneIcon}</div>
  `;
  contactWrap.appendChild(a);
});

/* =====================================================================
   SPLASH TIMING — سکانس سینمایی
   مراحل: باز شدن کادر سینمااسکوپ -> ظهور لوگو از تار به شفاف -> درخشش
           -> نمایش نام و خط -> بسته‌شدن نوارها به سمت مرکز (کات به مشکی)
           -> محو کامل و ورود به صفحه‌ی اصلی
===================================================================== */
const splash = document.getElementById('splash');

const T = {
  narrowAt:   150,   // نوارهای سینمایی باریک می‌شوند (شروع فیلم)
  closeAt:    3000,  // شروع بسته‌شدن نوارها به سمت مرکز (کات سینمایی)
  fadeAt:     3550,  // محو کامل اسپلش و نمایش سایت
  removeAt:   4400   // حذف کامل از DOM
};

window.addEventListener('load', ()=>{
  setTimeout(()=> splash.classList.add('narrow'), T.narrowAt);
  setTimeout(()=> splash.classList.add('close'),   T.closeAt);
  setTimeout(()=> splash.classList.add('fade-out'),T.fadeAt);
  setTimeout(()=> splash.remove(),                 T.removeAt);
});

/* ================= SCROLL REVEAL ================= */
const sections = document.querySelectorAll('section');
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting) e.target.classList.add('in'); });
},{threshold:.15});
sections.forEach(s=>io.observe(s));
</script>
